spring:
  application:
    name: barberflow-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/barberflow}
    username: ${DB_USER:barberflow}
    password: ${DB_PASSWORD:barberflow}
  jpa:
    open-in-view: false          # evita consultas perezosas fuera de la capa de servicio
    hibernate:
      ddl-auto: validate         # el esquema lo crea Flyway; Hibernate solo verifica que coincida
    properties:
      hibernate:
        jdbc:
          time_zone: America/Bogota
  flyway:
    enabled: true
    locations: classpath:db/migration
